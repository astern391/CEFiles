<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Tools</title>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f3f2ee; }
  #toggleBar {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:8px; background:#14181f; position:sticky; top:0; z-index:1000;
  }
  #toggleBar button {
    font-size:13px; font-weight:600; padding:7px 16px; border-radius:8px;
    border:1px solid #3a3f4a; background:#20242d; color:#c9ccd3; cursor:pointer;
  }
  #toggleBar button.active { background:#6b7fd7; color:#fff; border-color:#6b7fd7; }
  #appFrameWrap { position:relative; width:100%; height:calc(100vh - 41px); }
  iframe.app-frame {
    position:absolute; top:0; left:0; width:100%; height:100%; border:0; background:#f3f2ee;
  }
  iframe.app-frame.hidden { display:none; }
  @media print {
    #toggleBar { display:none; }
    #appFrameWrap { height:auto; }
  }
</style>
</head>
<body>

<div id="toggleBar">
  <button id="btnShowReport" class="active">📋 Frame Report</button>
  <button id="btnShowField">📱 Field Capture</button>
  <span id="handoffStatus" style="font-size:11px;color:#8b90a0;min-width:80px;"></span>
</div>

<div id="appFrameWrap">
  <iframe id="frameReport" class="app-frame" title="Frame Report"></iframe>
  <iframe id="frameField" class="app-frame hidden" title="Field Capture"></iframe>
</div>

  function b64ToUtf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const frameReport = document.getElementById('frameReport');
  const frameField = document.getElementById('frameField');
  const btnShowReport = document.getElementById('btnShowReport');
  const btnShowField = document.getElementById('btnShowField');

  // Carry projectId/projectName query params from the outer page into both apps
  const qs = window.location.search;

  frameReport.srcdoc = b64ToUtf8(REPORT_B64);
  frameField.srcdoc = b64ToUtf8(FIELD_B64);

  function showReport() {
    frameReport.classList.remove('hidden');
    frameField.classList.add('hidden');
    btnShowReport.classList.add('active');
    btnShowField.classList.remove('active');
  }
  function showField() {
    frameField.classList.remove('hidden');
    frameReport.classList.add('hidden');
    btnShowField.classList.add('active');
    btnShowReport.classList.remove('active');
  }

  // ---- Cross-app data handoff on toggle ----
  // Each embedded app listens for REQUEST_EXPORT / IMPORT_DATA postMessages
  // (see the bottom of each app's own script). When switching, we ask the
  // currently-visible app for its current data and hand it to the other app,
  // so in-progress work isn't left behind when you flip the toggle.
  //
  // Field Capture only understands a reduced subset of the project (title,
  // datum, positions, notes — no plan images, photos, line placements,
  // display/leveler settings, or markups). Report's own loader does a full
  // replace of its state from whatever it's handed, so if Field's reduced
  // export were sent straight back into Report, all of that report-only
  // data would be silently wiped.
  //
  // Report's iframe is never reloaded when the toggle switches views (only
  // hidden via CSS — see showReport/showField below), so its live state is
  // always intact and available on demand. Rather than caching a snapshot
  // of it (which can go stale across multiple switches, silently dropping
  // whatever changed since), we fetch Report's CURRENT live export at the
  // moment we're switching back to it, and merge Field's edits onto that —
  // Field's data is used only for the fields it can actually edit,
  // everything else comes straight from Report's own live state.
  let activeApp = 'report';
  const statusEl = document.getElementById('handoffStatus');

  function requestExport(iframe) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        window.removeEventListener('message', handler);
        reject(new Error('timeout'));
      }, 2500);
      function handler(ev) {
        if (ev.source === iframe.contentWindow && ev.data && ev.data.type === 'EXPORT_DATA') {
          clearTimeout(timeout);
          window.removeEventListener('message', handler);
          resolve(ev.data.payload);
        }
      }
      window.addEventListener('message', handler);
      iframe.contentWindow.postMessage({ type: 'REQUEST_EXPORT' }, '*');
    });
  }

  function mergeSections(reportSections, fieldSections) {
    const byId = {};
    (reportSections || []).forEach(s => { byId[s.id] = s; });
    const seen = {};
    const merged = (fieldSections || []).map(fs => {
      const rs = byId[fs.id];
      seen[fs.id] = true;
      return rs ? Object.assign({}, rs, { title: fs.title }) : fs;
    });
    (reportSections || []).forEach(rs => { if (!seen[rs.id]) merged.push(rs); });
    return merged;
  }

  function mergePositions(reportPositions, fieldPositions) {
    reportPositions = reportPositions || [];
    return (fieldPositions || []).map((fp, i) => {
      const rp = reportPositions[i];
      return {
        position: fp.position,
        variance: fp.variance,
        calculatedHeight: rp ? rp.calculatedHeight : undefined,
        extCollar: rp ? !!rp.extCollar : false,
        heightLabelOffset: rp ? (rp.heightLabelOffset || { dx: 0, dy: 0 }) : { dx: 0, dy: 0 }
      };
    });
  }

  function mergeElevations(reportElevations, fieldElevations) {
    const byId = {};
    (reportElevations || []).forEach(e => { byId[e.id] = e; });
    const seen = {};
    const merged = (fieldElevations || []).map(fe => {
      const re = byId[fe.id];
      seen[fe.id] = true;
      if (!re) return fe; // new elevation created in Field — Report defaults the rest
      return Object.assign({}, re, {
        sectionId: fe.sectionId || re.sectionId,
        title: fe.title,
        datum: fe.datum,
        levelerType: fe.levelerType,
        width: fe.width,
        widthType: fe.widthType,
        wallDeduction: fe.wallDeduction,
        bulkheadChecked: fe.bulkheadChecked,
        notes: fe.notes,
        positions: mergePositions(re.positions, fe.positions)
      });
    });
    (reportElevations || []).forEach(re => { if (!seen[re.id]) merged.push(re); });
    return merged;
  }

  function mergeSiteConditions(reportSC, fieldSC) {
    const byId = {};
    (reportSC || []).forEach(s => { byId[s.id] = s; });
    const seen = {};
    const merged = (fieldSC || []).map(fs => {
      const rs = byId[fs.id];
      seen[fs.id] = true;
      return rs ? Object.assign({}, rs, { sectionId: fs.sectionId || rs.sectionId, title: fs.title, notes: fs.notes }) : fs;
    });
    (reportSC || []).forEach(rs => { if (!seen[rs.id]) merged.push(rs); });
    return merged;
  }

  function mergeMarkups(reportMarkups, fieldMarkups) {
    // Field has no UI for plan markups, so it never edits them — but it CAN carry a
    // set through untouched (e.g. loaded directly from a saved JSON on mobile before
    // Report ever saw that project). Report's own live copy wins for any markup id
    // both sides have; anything Field has that Report doesn't (Report started empty,
    // or that markup was never in Report's live state) gets added in rather than
    // dropped, so this scenario doesn't silently lose data.
    const seen = {};
    const merged = (reportMarkups || []).map(m => { seen[m.id] = true; return m; });
    (fieldMarkups || []).forEach(fm => { if (!seen[fm.id]) merged.push(fm); });
    return merged;
  }

  function mergeFieldIntoReport(reportPayload, fieldPayload) {
    return {
      projectName: fieldPayload.projectName || reportPayload.projectName,
      client: fieldPayload.client || reportPayload.client,
      location: fieldPayload.location || reportPayload.location,
      dirttPM: reportPayload.dirttPM,
      installSupervisor: reportPayload.installSupervisor,
      contractor: reportPayload.contractor,
      levelerSettings: reportPayload.levelerSettings,
      planMarkups: mergeMarkups(reportPayload.planMarkups, fieldPayload.planMarkups),
      planSections: mergeSections(reportPayload.planSections, fieldPayload.planSections),
      elevations: mergeElevations(reportPayload.elevations, fieldPayload.elevations),
      siteConditions: mergeSiteConditions(reportPayload.siteConditions, fieldPayload.siteConditions)
    };
  }

  async function switchTo(target) {
    if (target === activeApp) return;
    statusEl.textContent = 'Syncing…';
    try {
      if (target === 'field') {
        // Leaving Report for Field: hand Report's current data to Field.
        const payload = await requestExport(frameReport);
        frameField.contentWindow.postMessage({ type: 'IMPORT_DATA', payload: payload }, '*');
      } else {
        // Leaving Field for Report: fetch BOTH apps' current live state and
        // merge Field's edits onto Report's own — Report's iframe was never
        // destroyed, so this is always fresh, never a stale snapshot.
        const [reportPayload, fieldPayload] = await Promise.all([
          requestExport(frameReport),
          requestExport(frameField)
        ]);
        const merged = mergeFieldIntoReport(reportPayload, fieldPayload);
        frameReport.contentWindow.postMessage({ type: 'IMPORT_DATA', payload: merged }, '*');
      }
      statusEl.textContent = 'Synced';
    } catch (e) {
      // Handoff failed (e.g. a frame hasn't finished loading yet) — still
      // switch views, just without transferring data this time.
      statusEl.textContent = "Couldn't sync data";
    }
    setTimeout(() => { statusEl.textContent = ''; }, 1800);
    activeApp = target;
    if (target === 'report') showReport(); else showField();
  }

  btnShowReport.addEventListener('click', () => switchTo('report'));
  btnShowField.addEventListener('click', () => switchTo('field'));

  // Starts on Frame Report; use the toggle buttons above to switch.
</script>

</body>
</html>
