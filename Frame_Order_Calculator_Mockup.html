<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame Order Calculator</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #dde1e6;
    --text: #1f2430;
    --text-muted: #6b7280;
    --accent: #2c5f7c;
    --accent-light: #e8f0f4;
    --warn: #b45309;
    --warn-bg: #fef3e2;
    --danger: #b91c1c;
    --mono: 'Cascadia Code', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 { font-size: 20px; margin: 0 0 4px 0; }
  .header .sub { color: var(--text-muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.subtle { background: transparent; border-color: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #status {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    display: none;
  }
  #status.show { display: block; }
  #status.loading { background: var(--accent-light); color: var(--accent); }
  #status.error { background: #fdecea; color: var(--danger); }
  #status.success { background: #e8f5e9; color: #256029; }

  .elevation-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .elev-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .elev-title {
    font-size: 15px;
    font-weight: 600;
    border: none;
    background: transparent;
    border-bottom: 1px dashed transparent;
    padding: 2px 0;
    width: 220px;
  }
  .elev-title:focus { outline: none; border-bottom-color: var(--accent); }
  .elev-remove { color: var(--danger); font-size: 12px; }

  table.positions {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 12px;
  }
  table.positions th, table.positions td {
    padding: 6px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  table.positions th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  table.positions input {
    width: 64px;
    text-align: center;
    font-family: var(--mono);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px;
  }
  .calc-height { font-family: var(--mono); color: var(--text-muted); }

  .field-row {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .field input[type="number"], .field input[type="text"], .field select {
    font-family: var(--mono);
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    width: 100px;
  }
  .field.checkbox { flex-direction: row; align-items: center; gap: 6px; }
  .leveler-select { width: 130px; }
  .result-block {
    margin-left: auto;
    display: flex;
    gap: 24px;
  }
  .result { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .result .label { font-size: 11px; color: var(--text-muted); }
  .result .value { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .result.order .value { color: var(--accent); font-size: 18px; }

  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 20px;
  }
  .summary-card h2 { font-size: 14px; margin: 0 0 10px 0; }
  table.summary { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.summary th, table.summary td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  table.summary td.num { font-family: var(--mono); text-align: right; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .settings-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .settings-title { font-size: 13px; font-weight: 600; color: var(--text); margin-right: 4px; }
  .settings-row .field input { width: 70px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper input { width: 52px; text-align: center; }
  .stepper-btn {
    width: 22px; height: 22px; padding: 0; line-height: 1;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--card); font-size: 13px; cursor: pointer;
  }
  .stepper-btn:hover { background: var(--accent-light); }
  .group-swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .elev-header.grouped {
    margin: -16px -18px 12px -18px;
    padding: 12px 18px;
    border-radius: 10px 10px 0 0;
  }

  /* ---- Report-style header (ported from Progress Report Builder) ---- */
  .titleblock {
    position: relative;
    overflow: hidden;
    border-bottom: 2px solid #14181f;
    padding: 28px 40px 0 40px;
    background: #f4f1ea;
    border-radius: 8px 8px 0 0;
    margin-bottom: 20px;
  }
  .tb-content { position: relative; z-index: 1; }
  .watermark { position: absolute; top: -30px; right: -16px; width: 190px; height: auto; pointer-events: none; }
  .tb-logo { height: 52px; width: auto; display: block; margin-bottom: 16px; }
  .tb-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 22px; }
  .tb-title h1 { font-size: 36px; line-height: 1.05; font-weight: 700; margin: 0; color: #14181f; }
  .tb-title h1:focus { outline: 1px solid var(--accent, #6b7fd7); outline-offset: 4px; border-radius: 4px; }
  .tb-title p { margin: 6px 0 0 0; font-size: 15px; color: var(--accent); font-weight: 600; }
  .tb-sheet { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
  .tb-grid { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid #ddd8cc; }
  .tb-cell { border-right: 1px solid #ddd8cc; padding: 10px 14px 14px 0; }
  .tb-cell:last-child { border-right: none; }
  .tb-cell .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 5px; }
  .tb-cell .val { font-size: 13px; font-weight: 500; color: #14181f; word-break: break-word; }
  .tb-cell input.val { border: none; background: transparent; padding: 0; width: 100%; font-family: inherit; }
  .tb-cell input.val:focus { outline: 1px solid var(--accent, #6b7fd7); outline-offset: 2px; border-radius: 2px; }

  /* ---- App bar (matches Progress Report Builder) ---- */
  .appbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: #182129; color: #EFEDE6;
    position: sticky; top: 0; z-index: 50;
    margin: -24px -24px 24px -24px;
  }
  .appbar .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8C4CB; }
  .appbar .brand img { height: 20px; width: auto; display: block; filter: brightness(0) invert(1); opacity: 0.92; }
  .appbar .actions { display: flex; gap: 10px; }
  .appbar .btn {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 2px; border: 1px solid #55636d; background: transparent; color: #EFEDE6;
    cursor: pointer; transition: .15s;
  }
  .appbar .btn:hover { background: #2B3743; }
  .appbar .btn.primary { background: #E0972E; border-color: #E0972E; color: #20160a; font-weight: 600; }
  .appbar .btn.primary:hover { background: #c8811f; }

  .plan-view {
    position: relative;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #f0f0f0;
  }
  .plan-view img { display: block; width: 100%; height: auto; }
  .plan-marker {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    transform: translate(-50%, -50%);
    cursor: default;
  }
  .plan-marker-label {
    position: absolute;
    transform: translate(-50%, 4px);
    font-family: var(--mono);
    font-size: 10px;
    background: rgba(255,255,255,0.9);
    padding: 1px 4px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
  }

  @media print {
    body { background: white; padding: 0; }
    .appbar, .actions, #status { display: none !important; }
    .titleblock { margin-top: 0; }
    .elevation-card, .summary-card { break-inside: avoid; border: 1px solid #999; }
    button { display: none; }
    input { border: none !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>

<script>
  // ---- CONFIG: fill these in with your Power Automate HTTP trigger URLs ----
  const LOAD_FLOW_URL = "PASTE_LOAD_FLOW_URL_HERE";
  const SAVE_FLOW_URL = "PASTE_SAVE_FLOW_URL_HERE";
  // ---------------------------------------------------------------------

  const params = new URLSearchParams(window.location.search);
  const projectId = params.get("projectId") || "";
  let projectName = params.get("projectName") || "Untitled Project";

  document.getElementById("projectTitle").textContent = projectName;
  document.getElementById("reportDate").textContent = new Date().toLocaleDateString();

  function updateProjectName(value) {
    projectName = (value || "").trim() || "Untitled Project";
    render();
  }

  let elevations = []; // { id, title, datum, carpetChecked, ceilingChecked, frameAdjustment, markerX, markerY, positions: [{position, variance, calculatedHeight}] }
  let nextLocalId = 1;
  let planImageUrl = "";

  // ---- Base leveler adjustment range ----
  // Raise shrinks the effective installed height (lets a taller order fit a shorter opening).
  // Drop grows the effective installed height (lets a shorter order fit a taller opening).
  // Reserve = capacity intentionally left unused as a safety margin, applied uniformly across leveler types.
  // Capacities themselves are fixed per leveler hardware (set per elevation via Leveler Type).
  const LEVELER_CAPACITIES = {
    Classic: { raiseCapacity: 0.375, dropCapacity: 1 },
    Inspire: { raiseCapacity: 0.5, dropCapacity: 0.625 }
  };
  let levelerSettings = { raiseReserve: 0.125, dropReserve: 0, groupDropLimit: 0.375 };

  function leverageForElevation(e) {
    const caps = LEVELER_CAPACITIES[e.levelerType] || LEVELER_CAPACITIES.Classic;
    return {
      raiseUse: Math.max(0, caps.raiseCapacity - levelerSettings.raiseReserve),
      dropUse: Math.max(0, caps.dropCapacity - levelerSettings.dropReserve)
    };
  }

  const GROUP_COLORS = ["#FDE68A","#BFDBFE","#BBF7D0","#FBCFE8","#DDD6FE","#FCA5A5","#99F6E4","#FED7AA","#C7D2FE","#D9F99D"];
  function groupColor(i) { return GROUP_COLORS[i % GROUP_COLORS.length]; }

  function renderPlanView() {
    const container = document.getElementById("planViewContainer");
    if (!planImageUrl) {
      container.innerHTML = "";
      return;
    }
    const { elevToGroup } = computeGroups();
    const markers = elevations.map((e, idx) => {
      if (e.markerX == null || e.markerY == null) return "";
      const color = groupColor(elevToGroup[idx] ?? 0);
      return `
        <div class="plan-marker" style="left:${e.markerX}%; top:${e.markerY}%; background:${color};" title="${e.title}"></div>
        <div class="plan-marker-label" style="left:${e.markerX}%; top:${e.markerY}%;">${e.title}</div>
      `;
    }).join("");

    container.innerHTML = `
      <div class="summary-card">
        <h2>Plan View — Order Height Groups</h2>
        <div class="plan-view">
          <img src="${planImageUrl}" alt="Plan">
          ${markers}
        </div>
      </div>
    `;
  }

  function stepperField(label, field, value, title) {
    return `<div class="field">
      <label${title ? ` title="${title}"` : ""}>${label}</label>
      <div class="stepper">
        <button type="button" class="stepper-btn" onclick="nudgeLeveler('${field}', -0.0625)">−</button>
        <input type="text" value="${fractionDisplay(value)}" onchange="updateLeveler('${field}', this.value)">
        <button type="button" class="stepper-btn" onclick="nudgeLeveler('${field}', 0.0625)">+</button>
      </div>
    </div>`;
  }

  function renderLevelerSettings() {
    document.getElementById("levelerSettings").innerHTML = `
      <div class="settings-row">
        <span class="settings-title">Base Leveler Range</span>
        ${stepperField("Raise reserve", "raiseReserve", levelerSettings.raiseReserve)}
        ${stepperField("Drop reserve", "dropReserve", levelerSettings.dropReserve)}
        ${stepperField("Group drop limit", "groupDropLimit", levelerSettings.groupDropLimit, "Caps drop variation within one group — lower this to force more (tighter) groups even if the leveler could physically span the whole set.")}
      </div>
      <div class="hint" style="margin-top:6px;">Raise/drop capacities come from each elevation's Leveler Type (Classic: 3/8" raise, 1" drop — Inspire: 1/2" raise, 5/8" drop). Reserve and group drop limit apply uniformly across types. "Group drop limit" caps how much extra drop (beyond what an elevation would need on its own) it will accept to share an order height with others.</div>
    `;
  }
  function updateLeveler(field, value) {
    levelerSettings[field] = parseHeightToDecimal(value) || 0;
    render();
  }
  function nudgeLeveler(field, delta) {
    const next = Math.max(0, (levelerSettings[field] || 0) + delta);
    levelerSettings[field] = Math.round(next * 16) / 16;
    render();
  }

  // ---- Group elevations onto the fewest possible order heights ----
  // Each elevation tolerates a WINDOW of order heights, bounded by how far the base can
  // raise (minus reserve) and drop (minus reserve). Greedy interval-point-cover picks the
  // fewest order heights that land inside every elevation's window.
  function computeGroups() {
    const groupDropLimit = Math.max(0, levelerSettings.groupDropLimit);
    const windows = elevations.map((e, idx) => {
      const calc = computeElevation(e);
      const { raiseUse, dropUse } = leverageForElevation(e);
      const groupDropUse = Math.min(dropUse, groupDropLimit);
      // Carpet/tegular deductions shift the whole raise/drop window down before
      // the leveler capacities are applied, same offset used in computeElevation().
      const dedTotal = (e.carpetChecked ? CARPET_DEDUCTION : 0) + (e.ceilingChecked ? CEILING_DEDUCTION : 0);
      const adjMin = calc.min - dedTotal;
      const adjMax = calc.max - dedTotal;
      const ohIdeal = adjMin + raiseUse;
      const low = Math.max(adjMax - dropUse, ohIdeal - groupDropUse);
      return { idx, low, high: ohIdeal };
    });
    const sorted = [...windows].sort((a, b) => a.high - b.high);
    const assigned = new Set();
    const groups = [];
    for (const w of sorted) {
      if (assigned.has(w.idx)) continue;
      const orderHeight = w.high;
      const members = [];
      for (const w2 of windows) {
        if (assigned.has(w2.idx)) continue;
        if (w2.low <= orderHeight && orderHeight <= w2.high) {
          members.push(w2.idx);
          assigned.add(w2.idx);
        }
      }
      groups.push({ orderHeight, members });
    }
    // map elevation idx -> group index
    const elevToGroup = {};
    groups.forEach((g, gIdx) => g.members.forEach(m => { elevToGroup[m] = gIdx; }));
    return { groups, elevToGroup };
  }

  let projectMeta = { client: "", location: "", dirttPM: "", installSupervisor: "", contractor: "" };

  function renderProjectMeta() {
    document.getElementById("metaClient").value = projectMeta.client || "";
    document.getElementById("metaLocation").value = projectMeta.location || "";
    document.getElementById("metaDirttPM").value = projectMeta.dirttPM || "";
    document.getElementById("metaInstallSupervisor").value = projectMeta.installSupervisor || "";
    document.getElementById("metaContractor").value = projectMeta.contractor || "";
  }

  function updateProjectMeta(field, value) {
    projectMeta[field] = value;
  }

  function setStatus(msg, type) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = "show " + type;
  }
  function clearStatus() {
    document.getElementById("status").className = "";
  }

  // ---- Fraction parsing (matches the in-app format, e.g. 108-1/8" or 108.125) ----
  function parseHeightToDecimal(text) {
    if (text === null || text === undefined || text === "") return 0;
    const t = String(text).trim();
    const asNum = parseFloat(t);
    if (!isNaN(asNum) && /^-?\d*\.?\d+$/.test(t)) return asNum;
    const m = t.match(/^(?:(-?\d+)'\s*)?(-)?(\d+)?(?:-(\d+)\/(\d+))?"?$/);
    if (!m) return 0;
    const feet = m[1] ? parseFloat(m[1]) : 0;
    const neg = m[2] === "-" ? -1 : 1;
    const whole = m[3] ? parseFloat(m[3]) : 0;
    const fracNum = m[4] ? parseFloat(m[4]) : 0;
    const fracDen = m[5] ? parseFloat(m[5]) : 1;
    return (feet * 12) + neg * (whole + (fracDen ? fracNum / fracDen : 0));
  }

  function decimalToFraction(val) {
    if (val === null || val === undefined || isNaN(val)) return "";
    const sixteenths = Math.round(val * 16);
    const whole = Math.trunc(sixteenths / 16);
    const frac = Math.abs(sixteenths % 16);
    const fracMap = {0:"",1:"1/16",2:"1/8",3:"3/16",4:"1/4",5:"5/16",6:"3/8",7:"7/16",8:"1/2",9:"9/16",10:"5/8",11:"11/16",12:"3/4",13:"13/16",14:"7/8",15:"15/16"};
    if (frac === 0) return whole + '"';
    return whole + "-" + fracMap[frac] + '"';
  }

  // Displays a stored value (decimal number or already-fraction text) as a fraction string for editable text fields.
  function fractionDisplay(val) {
    if (val === null || val === undefined || val === "") return "";
    const s = String(val);
    if (s.includes("/") || s.includes('"')) return s;
    const n = parseFloat(s);
    return isNaN(n) ? s : decimalToFraction(n).replace('"', "");

  function addElevation() {
    elevations.push({
      id: "local-" + (nextLocalId++),
      title: "New Elevation",
      datum: 60,
      levelerType: "Classic",
      width: "",

  function addPosition(elevIdx) {
    const e = elevations[elevIdx];
    const nextPos = e.positions.length ? Math.max(...e.positions.map(p => p.position)) + 1 : 1;
    e.positions.push({ position: nextPos, variance: "", calculatedHeight: "" });
    render();
  }

  function removePosition(elevIdx, posIdx) {
    elevations[elevIdx].positions.splice(posIdx, 1);
    render();
  }

  function removeElevation(elevIdx) {
    if (!confirm("Remove this elevation from the order?")) return;
    elevations.splice(elevIdx, 1);
    render();
  }

  // ---- Core calculation per elevation ----
  // Height per position = Datum + Variance (matches in-app CalculatedHeight logic)
  // Natural Height = Min - (Carpet Deduction if checked) - (Ceiling Deduction if checked)
  // Order Height (the height actually ordered) is decided per-GROUP in computeGroups(),
  // since elevations sharing a group must order the same height. Frame Adjustment is the
  // gap between an elevation's own Natural Height and its group's Order Height — how far
  // the leveler has to raise or drop that elevation to land on the shared order height.
  // NOTE: deduction amounts are fixed at 0.25" per the field mockup — adjust CARPET_DEDUCTION/
  // CEILING_DEDUCTION below if your standard deduction values differ.
  const CARPET_DEDUCTION = 0.25;
  const CEILING_DEDUCTION = 0.25;
  const WALL_DEDUCTIONS = { "N/A": 0, "3/4": 0.75, "1-1/2": 1.5 };

  // Signed fraction display for Frame Adjustment, e.g. "+ 3/16"" (raise) or "− 1/2"" (drop).
  // (decimalToFraction alone can't show the sign correctly for |val| < 1, since it truncates
  // toward zero for the whole-inches part.)
  function signedFraction(val) {
    if (val === null || val === undefined || isNaN(val)) return "";
    if (Math.round(val * 16) === 0) return '0"';
    const sign = val > 0 ? "+ " : "− ";
    return sign + decimalToFraction(Math.abs(val));
  }

  // Converts total inches to a feet'-inches-fraction" display, e.g. 113.25 -> 9'-5-1/4"
  function decimalToFeetInches(totalInches) {
    if (totalInches === null || totalInches === undefined || isNaN(totalInches)) return "";
    const feet = Math.trunc(totalInches / 12);
    const remainder = totalInches - feet * 12;
    const inchesPart = decimalToFraction(remainder).replace('"', "");
    return `${feet}'-${inchesPart}"`;
  }

  function computeElevation(e) {
    const heights = e.positions.map(p => {
      const v = parseHeightToDecimal(p.variance);
      return e.datum ? (parseFloat(e.datum) + v) : v;
    }).filter(h => !isNaN(h));

    const min = heights.length ? Math.min(...heights) : null;
    const max = heights.length ? Math.max(...heights) : null;
    const diff = (min !== null && max !== null) ? (max - min) : null;

    const carpetDed = e.carpetChecked ? CARPET_DEDUCTION : 0;
    const ceilingDed = e.ceilingChecked ? CEILING_DEDUCTION : 0;

    const naturalHeight = (min !== null) ? (min - carpetDed - ceilingDed) : null;

    return { heights, min, max, diff, naturalHeight };
  }

  // ---- Render ----
  function render() {
    const container = document.getElementById("elevations");
    if (elevations.length === 0) {
      container.innerHTML = '<div class="empty-state">No elevations loaded. Use "Add elevation" to enter one manually, or "Refresh from field data" once the load flow is configured.</div>';
      document.getElementById("summaryContainer").innerHTML = "";
      return;
    }

    renderPlanView();
    renderLevelerSettings();

    const { elevToGroup, groups } = computeGroups();

    container.innerHTML = elevations.map((e, idx) => {
      const calc = computeElevation(e);
      const groupIdx = elevToGroup[idx] ?? 0;
      const color = groupColor(groupIdx);
      const groupOH = groups[groupIdx] ? groups[groupIdx].orderHeight : null;
      const frameAdjustment = (groupOH !== null && calc.naturalHeight !== null) ? (groupOH - calc.naturalHeight) : null;
      const rows = e.positions.map((p, pIdx) => `
        <tr>
          <td>${p.position}</td>
          <td><input type="text" value="${p.variance ?? ''}" placeholder="e.g. 1-1/4"
              onchange="updatePosition(${idx}, ${pIdx}, 'variance', this.value)"></td>
          <td class="calc-height">${decimalToFraction(calc.heights[pIdx])}</td>
          <td><button class="subtle" onclick="removePosition(${idx}, ${pIdx})">✕</button></td>
        </tr>
      `).join("");

      return `
        <div class="elevation-card">
          <div class="elev-header grouped" style="background:${color};">
            <input class="elev-title" value="${e.title}" onchange="updateElevation(${idx}, 'title', this.value)">
            <button class="subtle elev-remove" onclick="removeElevation(${idx})">Remove elevation</button>
          </div>

          <div class="field-row" style="border-top:none; padding-top:0; margin-bottom:10px;">
            <div class="field">
              <label>Datum</label>
              <input type="number" step="0.0625" value="${e.datum}" onchange="updateElevation(${idx}, 'datum', this.value)">
            </div>
            <div class="field">
              <label>Leveler Type</label>
              <select class="leveler-select" onchange="updateElevation(${idx}, 'levelerType', this.value)">
                <option value="Classic" ${(e.levelerType || "Classic") === "Classic" ? "selected" : ""}>Classic</option>
                <option value="Inspire" ${e.levelerType === "Inspire" ? "selected" : ""}>Inspire</option>
              </select>
            </div>
            <div class="field">
              <label>Width (in.)</label>
              <input type="text" value="${e.width ?? ''}" placeholder="e.g. 114" onchange="updateElevation(${idx}, 'width', this.value)">
            </div>
            <div class="field">
              <label>Adjusted Width</label>
              <input type="text" value="${decimalToFeetInches(parseHeightToDecimal(e.width) - (WALL_DEDUCTIONS[e.wallDeduction || 'N/A'] || 0))}" readonly style="background:#f5f6f8; color:var(--text-muted);">
            </div>
            <div class="field">
              <label>Wall Deduction</label>
              <select onchange="updateElevation(${idx}, 'wallDeduction', this.value)">
                <option value="N/A" ${(e.wallDeduction || "N/A") === "N/A" ? "selected" : ""}>N/A</option>
                <option value="3/4" ${e.wallDeduction === "3/4" ? "selected" : ""}>3/4</option>
                <option value="1-1/2" ${e.wallDeduction === "1-1/2" ? "selected" : ""}>1-1/2</option>
              </select>
            </div>
          </div>

          <table class="positions">
            <thead><tr><th>Position</th><th>Variance</th><th>Height</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <button class="subtle" onclick="addPosition(${idx})" style="margin-bottom:12px;">+ Add position</button>

          <div class="field-row">
            <div class="field checkbox">
              <input type="checkbox" ${e.carpetChecked ? "checked" : ""} onchange="updateElevation(${idx}, 'carpetChecked', this.checked)">
              <label>Carpet Deduction (${CARPET_DEDUCTION}")</label>
            </div>
            <div class="field checkbox">
              <input type="checkbox" ${e.ceilingChecked ? "checked" : ""} onchange="updateElevation(${idx}, 'ceilingChecked', this.checked)">
              <label>Tegular Deduction (${CEILING_DEDUCTION}")</label>
            </div>
            <div class="field">
              <label>Frame Adjustment</label>
              <input type="text" value="${signedFraction(frameAdjustment)}" readonly
                  title="How far the leveler raises or drops this elevation from its natural height to reach the group's order height"
                  style="background:#f5f6f8; color:var(--text-muted);">
            </div>

            <div class="result-block">
              <div class="result">
                <span class="label">Min / Max</span>
                <span class="value">${decimalToFraction(calc.min)} – ${decimalToFraction(calc.max)}</span>
              </div>
              <div class="result">
                <span class="label">Difference</span>
                <span class="value">${decimalToFraction(calc.diff)}</span>
              </div>
              <div class="result order">
                <span class="label">Order Height</span>
                <span class="value">${decimalToFraction(groupOH)}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join("");

    renderSummary();
  }

  function renderSummary() {
    const { groups, elevToGroup } = computeGroups();

    const rows = elevations.map((e, idx) => {
      const calc = computeElevation(e);
      const color = groupColor(elevToGroup[idx] ?? 0);
      const groupOH = groups[elevToGroup[idx] ?? 0].orderHeight;
      const adjWidth = decimalToFeetInches(parseHeightToDecimal(e.width) - (WALL_DEDUCTIONS[e.wallDeduction || "N/A"] || 0));
      return `<tr><td><span class="group-swatch" style="background:${color};"></span>${e.title}</td><td class="num">${adjWidth}</td><td class="num">${decimalToFraction(calc.min)}</td><td class="num">${decimalToFraction(groupOH)}</td><td class="num">${decimalToFraction(calc.max)}</td></tr>`;
    }).join("");

    const groupRows = groups.map((g, gIdx) => {
      const names = g.members.map(m => elevations[m].title).join(", ");
      return `<tr><td><span class="group-swatch" style="background:${groupColor(gIdx)};"></span>Group ${gIdx + 1}</td><td class="num">${decimalToFraction(g.orderHeight)}</td><td>${names}</td></tr>`;
    }).join("");

    const allCalcs = elevations.map(computeElevation);
    const projMin = Math.min(...allCalcs.map(c => c.min));
    const projMax = Math.max(...allCalcs.map(c => c.max));

    const groupRangeRows = groups.map((g, gIdx) => {
      const memberCalcs = g.members.map(m => allCalcs[m]);
      const gMin = Math.min(...memberCalcs.map(c => c.min));
      const gMax = Math.max(...memberCalcs.map(c => c.max));
      return `<tr><td><span class="group-swatch" style="background:${groupColor(gIdx)};"></span>Group ${gIdx + 1}</td><td class="num">${decimalToFraction(gMin)}</td><td class="num">${decimalToFraction(gMax)}</td><td class="num">${decimalToFraction(gMax - gMin)}</td></tr>`;
    }).join("");

    document.getElementById("summaryContainer").innerHTML = `
      <div class="summary-card">
        <h2>Order Height Groups — ${groups.length} of ${elevations.length} elevations</h2>
        <table class="summary">
          <thead><tr><th>Group</th><th>Order Height</th><th>Elevations</th></tr></thead>
          <tbody>${groupRows}</tbody>
        </table>
      </div>
      <div class="summary-card">
        <h2>Project Order Summary — ${projectName}</h2>
        <table class="summary">
          <thead><tr><th>Elevation</th><th style="text-align:right">Width</th><th style="text-align:right">Min</th><th style="text-align:right">Order Height</th><th style="text-align:right">Max</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="summary-card">
        <h2>Frame Range Across All Elevations</h2>
        <table class="summary">
          <thead><tr><th></th><th style="text-align:right">Min</th><th style="text-align:right">Max</th><th style="text-align:right">Spread</th></tr></thead>
          <tbody>
            <tr style="font-weight:600;"><td>Overall</td><td class="num">${decimalToFraction(projMin)}</td><td class="num">${decimalToFraction(projMax)}</td><td class="num">${decimalToFraction(projMax - projMin)}</td></tr>
            ${groupRangeRows}
          </tbody>
        </table>
      </div>
    `;
  }

  function updateElevation(idx, field, value) {
    elevations[idx][field] = value;
    render();
  }
  function nudgeElevation(idx, field, delta) {
    const current = parseHeightToDecimal(elevations[idx][field]) || 0;
    const next = Math.max(0, current + delta);
    elevations[idx][field] = fractionDisplay(Math.round(next * 16) / 16);
    render();
  }
  function updatePosition(elevIdx, posIdx, field, value) {
    elevations[elevIdx].positions[posIdx][field] = value;
    render();
  }

  // ---- Save to SharePoint via Power Automate flow ----
  async function saveOrder() {
    if (!SAVE_FLOW_URL || SAVE_FLOW_URL.indexOf("PASTE_") === 0) {
      setStatus("Save flow not configured yet.", "error");
      return;
    }
    setStatus("Saving…", "loading");
    const { elevToGroup, groups } = computeGroups();
    const payload = {
      projectId,
      projectName,
      generatedAt: new Date().toISOString(),
      elevations: elevations.map((e, idx) => {
        const calc = computeElevation(e);
        const groupOH = groups[elevToGroup[idx] ?? 0].orderHeight;
        const frameAdjustment = (groupOH !== null && calc.naturalHeight !== null) ? (groupOH - calc.naturalHeight) : null;
        return {
          id: e.id,
          title: e.title,
          datum: e.datum,
          levelerType: e.levelerType || "Classic",
          width: e.width || "",
          wallDeduction: e.wallDeduction || "N/A",
          carpetChecked: e.carpetChecked,
          ceilingChecked: e.ceilingChecked,
          min: calc.min,
          max: calc.max,
          diff: calc.diff,
          naturalHeight: calc.naturalHeight,
          orderHeight: groupOH,
          orderHeightFraction: decimalToFraction(groupOH),
          frameAdjustment: frameAdjustment,
          frameAdjustmentFraction: signedFraction(frameAdjustment),
          positions: e.positions
        };
      })
    };
    try {
      const res = await fetch(SAVE_FLOW_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Flow returned " + res.status);
      setStatus("Saved successfully.", "success");
    } catch (err) {
      setStatus("Save failed: " + err.message, "error");
    }
  }

  loadFieldData();
</script>

</body>
</html>
